<!DOCTYPE html>
<html><head><title>Tutorial: reading the output of dir</title></head>
<body><h1>Reading the output of dir</h1>
<p>Running <code>dir</code> in a folder prints one line per entry:</p>
<pre>01/01/2026  10:00 AM    &lt;DIR&gt;          Documents
01/01/2026  10:00 AM             1,024 notes.txt</pre>
<p>See also <a href="/docs/powershell">the PowerShell version</a>.</p></body></html>

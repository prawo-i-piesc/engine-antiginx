site_name: Engine-Antiginx Documentation
repo_name: prawo-i-piesc/engine-antiginx
repo_url: https://github.com/prawo-i-piesc/engine-antiginx
site_url: https://prawo-i-piesc.github.io/engine-antiginx/
strict: true

theme:
  name: material

  icon:
    repo: fontawesome/brands/git-alt

  font:
    text: Roboto
    code: JetBrains Mono

  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Dark Mode
      primary: black
      accent: indigo

    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Light Mode
      primary: blue
      accent: indigo

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: false
      enable_git_follow: false
      strict: false
      type: timeago
  - include-markdown

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - abbr
  - attr_list
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      toc_depth: 2-4

nav:
  - Engine Antiginx: README.md
  - Quick Start:
      - Quick Start: QuickStart/QuickStart.md
      - CLI: QuickStart/CLI.md
      - Docker: QuickStart/Docker.md
      - Docker-Compose (Archived): QuickStart/DockerCompose.md
  - CLI Documentation:
      - App: App/README.md
      - CVE: App/CVE/README.md
      - Detection: App/Detection/README.md
      - Errors: App/Errors/README.md
      - Execution: App/execution/README.md
      - GlobalHandler: App/GlobalHandler/README.md
      - Helpers: App/Helpers/README.md
      - HTTP: App/HTTP/README.md
      - Parameter-Parser: App/parser/README.md
      - Registry: App/Registry/README.md
      - Reporter: App/Reporter/README.md
      - Runner: App/Runner/README.md
      - Site Tests:
          - Introduction and framework: App/SiteTests/README.md
          - Bot Protection: App/SiteTests/BotProtectionTest/README.md
          - Content Security Policy: App/SiteTests/CSPTest/README.md
          - Cookie Security: App/SiteTests/CookieSecurityTest/README.md
          - Cross-Origin: App/SiteTests/CrossOriginTest/README.md
          - DNS Reputation: App/SiteTests/DNSReputationTest/README.md
          - Favicon Origin: App/SiteTests/FaviconOriginTest/README.md
          - HSTS: App/SiteTests/HSTSTest/README.md
          - HTTPS: App/SiteTests/HTTPSTest/README.md
          - JS Obfuscation: App/SiteTests/JSObfuscationTest/README.md
          - Permissions Policy: App/SiteTests/PermissionsPolicyTest/README.md
          - Phishing URL: App/SiteTests/PhishingURLTest/README.md
          - Referrer Policy: App/SiteTests/ReferrerPolicyTest/README.md
          - SSL Certificate: App/SiteTests/SSLCertificateSecurityTest/README.md
          - Server Header: App/SiteTests/ServerHeaderTest/README.md
          - Sitemap Security: App/SiteTests/SitemapSecurityTest/README.md
          - X-Content-Type-Options: App/SiteTests/XContentTypeOptionsTest/README.md
          - X-Frame-Options: App/SiteTests/XFrameTest/README.md
  - Engined Documentation:
      - Daemon: Engined/README.md

copyright: "Copyright &copy; 2025 Antiginx Team. All rights reserved."

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/prawo-i-piesc/engine-antiginx
